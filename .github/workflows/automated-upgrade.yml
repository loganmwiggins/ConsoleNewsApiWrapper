name: Upgrade

on:
  push:
    branches:
      - Upgrade_Assistant
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Upgrade .csproj files
        shell: pwsh
        run: |
          $targetFramework = "net9.0"
 
          Get-ChildItem -Path . -Recurse -Filter *.csproj | ForEach-Object {
            $csproj = $_.FullName
 
            # Replace the TargetFramework
            (Get-Content $csproj) -replace '<TargetFramework>.*?</TargetFramework>', "<TargetFramework>$targetFramework</TargetFramework>" | Set-Content $csproj
 
            # Extract existing packages with version
            $packages = Select-String -Path $csproj -Pattern '<PackageReference Include="([^"]+)" Version="([^"]+)"' | ForEach-Object {
              $matches = $_.Matches
              "dotnet add `"$csproj`" package $($matches.Groups[1].Value) --version $($matches.Groups[2].Value)"
            }
 
            # Run each command individually
            foreach ($cmd in $packages) {
              Invoke-Expression $cmd
            }
          }

      - name: Build the project
        run: dotnet build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-commit: upgraded project to net9.0" || echo "No changes to commit"
          git push origin Upgrade_Assistant
